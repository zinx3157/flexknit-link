<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlexKnit Link — Logistics × Merchandising Control Tower</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d9488'/%3E%3Cpath d='M6 13l5-6 5 6 5-6 5 6M6 21l5-6 5 6 5-6 5 6' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>
<div id="modal-root"></div>
<div id="toasts"></div>
<script src="views.js"></script>
<script src="app.js"></script>
<noscript><div style="padding:60px;text-align:center;font-family:sans-serif;color:#334155">FlexKnit Link needs JavaScript enabled.</div></noscript>
<script>
/* Friendly fallback: if the app engine didn't boot (this file opened without
   its server, e.g. double-clicked or previewed standalone), explain instead
   of showing a blank page. */
setTimeout(function () {
  var r = document.getElementById('root');
  if (r && !r.firstChild) {
    r.innerHTML = '<div style="max-width:600px;margin:80px auto;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#334155;text-align:center;padding:0 24px">' +
      '<div style="font-size:46px;line-height:1">🧶</div>' +
      '<h1 style="font-size:21px;margin:14px 0 10px">FlexKnit Link — server edition</h1>' +
      '<p style="color:#64748b;line-height:1.65;font-size:14.5px">This <code style="background:#f1f5f9;padding:2px 7px;border-radius:6px">index.html</code> is only the shell — it needs its API server behind it.<br>' +
      'Run <code style="background:#f1f5f9;padding:2px 7px;border-radius:6px">node server.js</code> in the <b>flexknit-link</b> folder, then open <b>http://localhost:3000</b>.</p>' +
      '<p style="color:#64748b;line-height:1.65;font-size:14.5px">For the single-file, no-install demo, open <b style="color:#0d9488">FlexKnit-Link-Demo.html</b> — it works by simply double-clicking it.</p>' +
      '</div>';
  }
}, 1200);
</script>
</body>
</html>
